services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - RAG_GENERATOR=mock
      - RAG_MIN_SCORE=0.25
    volumes:
      - ./data:/app/data
      - ./chroma:/app/chroma
  ui:
    build: .
    working_dir: /app
    volumes:
      - ./ui:/app/ui
    command: ["python", "-m", "streamlit", "run", "ui/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
